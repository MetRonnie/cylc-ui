name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  FORCE_COLOR: 2

jobs:
  cypress-run:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [electron]
        os: [ubuntu-latest]
    env:
      COVERAGE: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: yarn

      - name: Test (E2E)
        uses: cypress-io/github-action@v7
        env:
          BASE_URL: http://localhost:4173/
        with:
          spec: tests/e2e/specs/alert.cy.js
          build: yarn run build --mode offline
          start: yarn run preview
          config: baseUrl=${{ env.BASE_URL }}
          wait-on: ${{ env.BASE_URL }}
          browser: ${{ matrix.browser }}

      - name: Coverage report
        run: |
          yarn run -B nyc report
          cat coverage/lcov.info
